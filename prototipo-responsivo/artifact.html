
<title>Portal Jurídico Responsivo</title>
<style>:root{color-scheme:light}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<!-- Protótipo responsivo do Portal Jurídico (LLZ). Dados 100% fictícios.
     Desktop (≥ 1024 px): todas as telas e ações. Celular/tablet (< 1024 px): só o fluxo mobile de consulta.
     Gerado por prototipo-responsivo/build.py a partir de prototipo-mobile/index.html + src/. -->
<style>
/* Layout: no computador, o celular (375×812) fica centralizado ao lado de um painel de roteiro de teste;
   no celular, o app ocupa a tela inteira. Tokens = LLZ-DS (valores lidos das variáveis do Figma). */
:root{
  --brand:#004aeb; --brand-700:#003084; --brand-soft:rgba(0,74,235,.10); --brand-50:#eff4ff; --brand-ring:rgba(0,74,235,.24);
  --bg:#ffffff; --bg-2:#fafafa; --bg-3:#f5f5f5;
  --border:#d5d7da; --border-2:#e9eaeb;
  --text:#181d27; --text-2:#414651; --text-3:#535862; --text-4:#717680; --ph:#a4a7ae;
  --error:#d92d20; --error-700:#b42318; --error-50:#fef3f2; --error-200:#fecdca; --error-bg:#fee4e2;
  --success:#079455; --success-700:#067647; --success-50:#ecfdf3; --success-200:#abefc6; --success-bg:#dcfae6;
  --warning:#dc6803; --warning-bg:#fef0c7;
  --gb-50:#f8f9fc; --gb-200:#d5d9eb; --gb-700:#363f72;
  --overlay:rgba(10,13,18,.7);
  --backdrop:#e6eaf2; --panel:#ffffff; --device-edge:#11151c;
  --r-sm:6px; --r-md:8px; --r-lg:10px; --r-xl:12px; --r-2xl:16px;
  --sh-xs:0 1px 2px rgba(10,13,18,.05);
  --sh-lg:0 12px 16px -4px rgba(10,13,18,.08),0 4px 6px -2px rgba(10,13,18,.03);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --sb:59px; --hi:34px;
  color-scheme:light;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--backdrop);color:var(--text);font-family:var(--font);font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;background:var(--bg);padding-bottom:calc(var(--hi) + 16px);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.screen::-webkit-scrollbar{display:none}
.anim-push{animation:pushIn .28s cubic-bezier(.2,.7,.2,1)}
.anim-pop{animation:popIn .24s cubic-bezier(.2,.7,.2,1)}
.anim-fade{animation:fadeIn .2s ease-out}
@keyframes pushIn{from{transform:translateX(40%);opacity:.4}to{transform:none;opacity:1}}
@keyframes popIn{from{transform:translateX(-25%);opacity:.5}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.pad{padding-left:16px;padding-right:16px}
.stack{display:grid;gap:16px}
.appbar{position:sticky;top:0;z-index:6;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 16px;background:var(--bg);border-bottom:1px solid var(--border-2)}
.appbar.center{padding:0 8px;display:grid;grid-template-columns:40px 1fr 40px}
.appbar.center h1{margin:0;text-align:center;font-size:16px;line-height:24px;font-weight:600}
.ibtn{width:40px;height:40px;border:0;background:transparent;border-radius:var(--r-md);display:grid;place-items:center;color:var(--text-4)}
.ibtn:active{background:var(--bg-3)}
.logo{display:block;height:24px;width:auto;color:var(--brand)}
.logo-lg{height:40px}

h2.h-page{margin:0;font-size:20px;line-height:30px;font-weight:600;letter-spacing:-.01em}
.sub{margin:0;color:var(--text-3);font-size:14px}
.muted{color:var(--text-4)}

/* indicators */
.hscroll{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:0 16px;scroll-snap-type:x mandatory;scroll-padding:16px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.kpi{flex:none;width:200px;height:165px;background:var(--bg-3);border-radius:var(--r-xl);padding:16px;display:flex;flex-direction:column;justify-content:space-between;scroll-snap-align:start}
.kpi .kl{font-size:12px;line-height:16px;font-weight:500;color:var(--text-3)}
.kpi .kv{font-size:20px;line-height:30px;white-space:nowrap;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
.kpi .ks{font-size:12px;line-height:16px;color:var(--text-4)}
.kv.c-success{color:var(--success)} .kv.c-warning{color:var(--warning)} .kv.c-error{color:var(--error)}
.fi{width:40px;height:40px;border-radius:999px;display:grid;place-items:center;flex:none}
.fi.sm{width:32px;height:32px}
.fi.brand{background:var(--brand-soft);color:var(--brand)}
.fi.success{background:var(--success-bg);color:var(--success)}
.fi.warning{background:var(--warning-bg);color:var(--warning)}
.fi.error{background:var(--error-bg);color:var(--error)}
.fi.gray{background:var(--bg-3);color:var(--text-3)}
.fi.neutral{background:var(--bg-3);color:var(--text-2)}

/* inputs */
.field{display:grid;gap:6px}
.field label,.flabel{font-size:14px;line-height:20px;font-weight:500;color:var(--text-2)}
.inp{display:flex;align-items:center;gap:8px;height:40px;border:1px solid var(--border);border-radius:var(--r-md);background:#fff;box-shadow:var(--sh-xs);padding:0 12px;transition:border-color .15s,box-shadow .15s}
.inp:focus-within{border-color:var(--brand);box-shadow:var(--sh-xs),0 0 0 4px var(--brand-ring)}
.inp input{flex:1;min-width:0;width:100%;border:0;outline:0;background:transparent;font-size:16px;line-height:24px;color:var(--text);padding:0}
.inp input::placeholder{color:var(--ph)}
.inp .lead{color:var(--text-4);font-size:16px}
.inp .ico{color:var(--text-4);display:grid}
.inp.err{border-color:var(--error)}
.inp.err:focus-within{box-shadow:var(--sh-xs),0 0 0 4px rgba(217,45,32,.24)}
.inp.search{box-shadow:none}
.inp.search:focus-within{box-shadow:0 0 0 4px var(--brand-ring)}
.inp .eye{border:0;background:none;padding:0;color:var(--ph);display:grid}
.hint{font-size:14px;line-height:20px;color:var(--text-3)}
.hint.err{color:var(--error)}
.row2{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.row2>*{min-width:0}

/* buttons */
.btn{height:40px;border-radius:var(--r-md);border:1px solid transparent;padding:0 14px;font-size:14px;line-height:20px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;box-shadow:var(--sh-xs)}
.btn.lg{height:44px;font-size:16px}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:active{background:#0040cc}
.btn.secondary{background:#fff;border-color:var(--border);color:var(--text-2)}
.btn.secondary-color{background:#fff;border-color:rgba(0,74,235,.3);color:#013aa3}
.btn.sm{height:32px;padding:0 12px}
.cfoot-link{display:flex;justify-content:center}
.btn.danger{background:var(--error);color:#fff}
.btn.full{width:100%}
.btn:disabled{background:var(--bg-3);border-color:var(--border-2);color:var(--ph);box-shadow:none;cursor:not-allowed}
.link{border:0;background:none;padding:0;font-weight:600;font-size:14px;line-height:20px;color:var(--brand-700);justify-self:start;display:inline-flex;align-items:center;gap:4px}
.link.gray{color:var(--text-3)}
.link:disabled{color:var(--ph);cursor:not-allowed}

/* pills */
.pills{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;height:36px;padding:0 12px 0 14px;border-radius:999px;border:0;background:var(--bg-3);display:inline-flex;align-items:center;gap:4px;font-size:14px;line-height:20px;font-weight:500;color:var(--text-2);white-space:nowrap}
.pill.on{background:var(--brand-soft);color:var(--brand-700)}
.pill.static{padding:0 14px}
.pills.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}

.resrow{display:flex;align-items:center;justify-content:space-between;min-height:20px}
.resrow b{font-weight:500;color:var(--text-2)}

/* cards & fields */
.card{border:1px solid var(--border-2);border-radius:var(--r-xl);background:#fff;box-shadow:var(--sh-xs);padding:16px;display:grid;gap:12px}
button.card{width:100%;text-align:left;font:inherit;color:inherit}
.ctop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.ctitle{font-size:16px;line-height:24px;font-weight:600;color:var(--text)}
.csub{font-size:14px;line-height:20px;color:var(--text-3)}
.hr{height:1px;background:var(--border-2)}
.fld{display:grid;gap:2px;min-width:0}
.fl{font-size:14px;line-height:20px;font-weight:500;color:var(--text)}
.fv{font-size:14px;line-height:20px;color:var(--text-3);overflow-wrap:anywhere}
.fv.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;line-height:18px;font-weight:500;border:1px solid;white-space:nowrap}
.badge.sm{height:20px;font-size:12px}
.badge.error{background:var(--error-50);border-color:var(--error-200);color:var(--error-700)}
.badge.success{background:var(--success-50);border-color:var(--success-200);color:var(--success-700)}
.badge.brand{background:rgba(0,74,235,.05);border-color:rgba(0,74,235,.2);color:var(--brand-700)}
.badge.gb{background:var(--gb-50);border-color:var(--gb-200);color:var(--gb-700)}
.badge.gray{background:var(--bg-2);border-color:var(--border-2);color:var(--text-2)}
.count{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--bg-3);border:1px solid var(--border-2);font-size:12px;font-weight:500;color:var(--text-2)}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--bg-2);border:1px solid var(--border-2);border-radius:var(--r-md);padding:10px 12px;font-size:12px;line-height:18px;color:var(--text-3)}
.note svg{flex:none;margin-top:1px;color:var(--text-4)}

/* list loader */
.more{display:grid;gap:12px;justify-items:center;padding:8px 0 0}
.more span{font-size:14px;color:var(--text-3)}
.loader{display:inline-flex;gap:8px;align-items:center;min-height:40px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--border-2);border-top-color:var(--brand);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* empty */
.empty{display:grid;justify-items:center;text-align:center;gap:16px;padding:32px 16px}
.empty .ring{width:56px;height:56px;border-radius:999px;display:grid;place-items:center;background:var(--bg-3);color:var(--text-3);box-shadow:0 0 0 8px var(--bg-2)}
.empty h3{margin:0;font-size:16px;line-height:24px;font-weight:600}
.empty p{margin:0;color:var(--text-3)}

/* FAB */
.fab{position:absolute;right:16px;bottom:calc(var(--hi) + 24px);width:48px;height:48px;border-radius:999px;border:0;background:var(--brand);color:#fff;display:grid;place-items:center;box-shadow:var(--sh-lg);z-index:20;transition:transform .2s,opacity .2s}
.fab[hidden]{display:none!important}

/* detail */
.ident{padding:16px 16px 12px;display:grid;gap:2px}
.ident h2{margin:0 0 4px;font-size:20px;line-height:30px;font-weight:600}
.tabsbar{position:sticky;top:48px;z-index:5;background:var(--bg);padding:12px 16px 0;border-bottom:1px solid var(--border-2)}
.tabs{display:flex;gap:16px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;padding:0 4px 11px;font-size:14px;line-height:20px;font-weight:600;color:var(--text-4);border-bottom:2px solid transparent;margin-bottom:0;display:inline-flex;gap:8px;align-items:center}
.tabs.fade{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 24px),transparent)}
.tabs.fade.at-end{-webkit-mask-image:none;mask-image:none}
.tab.on{color:var(--brand-700);border-bottom-color:var(--brand)}
.tab:focus-visible{outline-offset:-2px;border-radius:4px}
.tabbody{padding:16px;display:grid;gap:16px}

.rec{display:flex;gap:12px;align-items:center;padding:14px 0;border:0;border-bottom:1px solid var(--border-2);background:none;width:100%;text-align:left}
.rec .rn{font-weight:600;color:var(--brand-700)}
.rec .rd{font-size:12px;line-height:16px;color:var(--text-4)}
.rec .rt{color:var(--text-3);margin-top:4px}
.rec .rb{flex:1;min-width:0;display:grid}
.rec svg{color:var(--text-4);flex:none}

.acc{border:1px solid var(--border-2);border-radius:var(--r-xl);background:#fff;box-shadow:var(--sh-xs)}
.acc>button{width:100%;border:0;background:none;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left}
.acc .at,.card .at{font-weight:600;color:var(--text)}
.acc .as{font-size:12px;line-height:18px;color:var(--text-3)}
.acc .ab{padding:0 16px 16px;display:grid;gap:12px}
.acc .chev{transition:transform .2s;color:var(--text-4);display:grid;place-items:center}
.acc.open .chev{transform:rotate(180deg)}
.chan{display:flex;align-items:center;gap:12px}
.chan-btn{border:0;background:none;padding:0;width:100%;text-align:left;align-items:flex-start;border-radius:var(--r-md)}
.chan-btn:active{background:var(--bg-2)}
.chan-btn .link{margin-top:4px}

/* menu (sidebar mobile) */
.menu{position:absolute;top:var(--sb);left:0;right:0;bottom:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .28s cubic-bezier(.2,.7,.2,1);visibility:hidden}
.menu.open{transform:none;visibility:visible}
.menu .mhead{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 16px;border-bottom:1px solid var(--border-2)}
.menu nav{padding:12px 16px;display:grid;flex:1;align-content:start}
.mitem{height:56px;padding:4px 0;border:0;background:none;width:100%}
.mitem span{height:48px;border-radius:var(--r-lg);display:flex;align-items:center;gap:12px;padding:0 16px;font-weight:500;color:var(--text-2)}
.mitem.on span{background:var(--brand-50);color:var(--brand-700)}
.mitem.on svg{color:var(--brand)}
.mitem svg{color:var(--text-4)}
.mfoot{border-top:1px solid var(--border-2);padding:16px 32px calc(var(--hi) + 16px);display:flex;align-items:center;gap:12px}
.avatar{width:40px;height:40px;border-radius:999px;background:var(--bg-3);border:1px solid rgba(0,0,0,.08);display:grid;place-items:center;font-weight:600;color:var(--text-3);flex:none}
.mfoot .who{flex:1;min-width:0;display:grid}
.mfoot .who b{font-weight:600;font-size:14px}
.mfoot .who span{color:var(--text-3)}
.mfoot .out{color:var(--error)}

/* sheets */
.ovl{position:absolute;inset:0;z-index:50;background:var(--overlay);opacity:0;transition:opacity .2s;backdrop-filter:blur(2px)}
.ovl.show{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:51;background:var(--bg);border-radius:16px 16px 0 0;max-height:calc(100% - var(--sb) - 12px);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.7,.2,1);box-shadow:var(--sh-lg)}
.sheet.show{transform:none}
.sheet .handle{padding:8px 0 4px;display:grid;place-items:center;flex:none}
.sheet .handle i{width:36px;height:4px;border-radius:2px;background:var(--border)}
.sheet .shead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:4px 8px 4px 16px;flex:none}
.sheet .shead h3{margin:0;padding-top:8px;font-size:16px;line-height:24px;font-weight:600}
.sheet .smeta{padding:0 16px 4px;display:grid;gap:4px;color:var(--text-3);flex:none}
.sheet .sbody{overflow-y:auto;padding:12px 16px 16px;display:grid;gap:16px;align-content:start;flex:1 1 auto;min-height:0}
.sheet .sfoot{flex:none;display:flex;align-items:center;gap:16px;padding:12px 16px;border-top:1px solid var(--border-2)}
.sheet .sfoot .btn{flex:1}
.sheet .safe{height:var(--hi);flex:none}
.sheet.confirm .sbody{gap:12px}
.sheet.confirm .cfoot{display:grid;gap:12px;padding:8px 16px 16px}

.opt{display:flex;align-items:center;gap:12px;min-height:44px;width:100%;border:0;background:none;padding:0;text-align:left;font-size:16px;line-height:24px;color:var(--text-2);font-weight:500}

.cb{width:20px;height:20px;flex:none;border-radius:6px;border:1px solid var(--border);background:#fff;display:grid;place-items:center;color:#fff}
.cb.radio{border-radius:999px}
.cb.on{background:var(--brand);border-color:var(--brand)}
.cb.radio.on{background:#fff;border:6px solid var(--brand)}
.dot{width:8px;height:8px;border-radius:999px;display:inline-block}
.slabel{font-size:14px;line-height:20px;font-weight:600;color:var(--text-2)}

/* access */
.auth{min-height:100%;display:flex;flex-direction:column;padding:56px 16px 24px;gap:40px}
.auth .brand{display:grid;justify-items:center}
.auth .form{display:grid;gap:20px}
.auth .head{display:grid;gap:4px}
.auth .head h2{margin:0;font-size:20px;line-height:30px;font-weight:600}
.auth .head p{margin:0;color:var(--text-3)}
.auth .center{justify-items:center;text-align:center}
.req{display:grid;gap:6px;margin-top:2px}
.req div{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--text-3)}
.req .ok{color:var(--success)} .req .no{color:var(--ph)}
.code{display:flex;gap:8px;justify-content:center}
.code input{width:44px;height:56px;border:1px solid var(--border);border-radius:var(--r-md);text-align:center;font-size:24px;line-height:32px;font-weight:500;box-shadow:var(--sh-xs);outline:0;padding:0;color:var(--brand-700)}
.code input::placeholder{color:var(--border)}
.code input:focus{border-color:var(--brand);box-shadow:var(--sh-xs),0 0 0 4px var(--brand-ring)}
.alert{display:flex;gap:12px;border:1px solid var(--error-200);background:var(--error-50);border-radius:var(--r-xl);padding:14px}
.alert b{display:block;font-weight:600;color:var(--error-700)}
.alert p{margin:2px 0 0;color:var(--text-2);font-size:14px}
.alert svg{color:var(--error);flex:none}
.links{display:flex;justify-content:space-between;align-items:center}
.demo{margin-top:auto;font-size:12px;line-height:16px;color:var(--text-4);text-align:center}
.demo button{border:0;background:none;padding:0;color:var(--brand-700);font-weight:600;font-size:12px;text-decoration:underline;text-underline-offset:2px}

/* histórico detalhe */
.mblk{display:grid;gap:4px}
.mblk .fl{color:var(--text-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.filechip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:1px solid var(--border);border-radius:var(--r-md);font-size:12px;font-weight:500;color:var(--text-2);background:#fff;box-shadow:var(--sh-xs)}
.strong{font-weight:600;color:var(--text)}
.del{color:var(--error);text-decoration:line-through}
.add{color:var(--success);font-weight:600}
.mail{border:1px solid var(--border-2);border-radius:var(--r-md);overflow:hidden;font-size:12px;line-height:17px;color:var(--text-3)}
.mail .mh{background:#0040d8;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:16px}
.mail .mh b{font-size:16px;letter-spacing:.02em}
.mail .mh small{display:block;font-size:9px;line-height:11px;opacity:.85}
.mail .mb{padding:14px 16px;display:grid;gap:8px}
.mail .mb h4{margin:0;color:var(--brand);font-size:13px}
.mail .mb p{margin:0}
.mail .mb .b{font-weight:600;color:var(--text-2)}

.modal{position:absolute;left:16px;right:16px;top:50%;z-index:61;background:var(--bg);border-radius:var(--r-xl);box-shadow:var(--sh-lg);padding:20px 16px 16px;display:grid;gap:16px;transform:translateY(-46%) scale(.98);opacity:0;transition:.22s}
.modal.show{opacity:1;transform:translateY(-50%)}
.modal h3{margin:0;font-size:18px;line-height:28px;font-weight:600}
.modal p{margin:0;color:var(--text-3)}
.ackchk{display:flex;gap:12px;align-items:flex-start;border:0;background:none;padding:0;text-align:left;font-size:14px;line-height:20px;color:var(--text-2);font-weight:500}

<style>/* ===== Estrutura responsiva: um fluxo por vez ===== */
html,body{height:auto;min-height:100%}
body{background:#fff}
#mob{display:none}
#desk{display:none}
html.m-mode{height:100%;overflow:hidden}
html.m-mode body{height:100%;overflow:hidden;background:#fff}
html.m-mode #mob{display:block}
html.d-mode #desk{display:block}
/* No fluxo mobile o "aparelho" ocupa a tela toda (celular e tablet) */
#mob{--sb:env(safe-area-inset-top,0px);--hi:env(safe-area-inset-bottom,0px)}
#mob .device{position:fixed;inset:0;width:100%;height:100%;height:100dvh;border-radius:0;box-shadow:none;overflow:hidden;background:var(--bg)}
#mob .sbar,#mob .hind{display:none}
#mob .menu{top:var(--sb)}
/* Em tablet o conteúdo fica legível sem esticar demais */
@media (min-width:640px){
  #mob .screen>.pad,#mob .screen>.ident,#mob .screen>.tabsbar,#mob .screen>#tabbody,#mob .screen>.auth{max-width:720px;margin-left:auto;margin-right:auto}
  #mob .sheet{max-width:640px;margin:0 auto}
  #mob .modal{max-width:480px;margin:0 auto}
}
</style>
<style>/* ===== Desktop (≥ 1024 px) · LLZ-DS ===== */

.d-auth .side{display:grid;place-items:center;padding:32px}
.d-auth .box{width:400px;max-width:100%;border:1px solid var(--border-2);border-radius:16px;box-shadow:var(--sh-lg);padding:32px;display:grid;gap:20px;background:#fff}
.d-auth .box svg.logo{height:40px;width:auto}
.d-auth .hd{display:grid;gap:4px}
.d-auth .hd h2{font-size:20px;line-height:30px;font-weight:600}
.d-auth .hd p{color:var(--text-3)}
.d-auth .ctr{justify-items:center;text-align:center}
.d-auth .alert{margin:0}
.d-auth .code{gap:8px}
.d-auth .code input{width:46px;height:52px}
.d-auth .links{display:flex;justify-content:space-between}
.d-auth .demo{margin:0;text-align:center;font-size:12px;color:var(--text-4)}

/* pop-over, modal, drawer, toast */
.d-pop{position:absolute;z-index:200;background:#fff;border:1px solid var(--border-2);border-radius:10px;box-shadow:var(--sh-lg);min-width:220px;max-width:360px}
.d-pop .pt{padding:14px 16px 4px;font-size:16px;font-weight:600}
.d-pop .pb{padding:8px 16px 16px;display:grid;gap:12px}
.d-pop .pf{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--border-2)}
.d-pop .opt{display:flex;align-items:center;gap:10px;min-height:32px;border:0;background:none;width:100%;text-align:left;padding:0;color:var(--text-2);font-weight:500}
.d-pop .mi{display:block;width:100%;border:0;background:none;text-align:left;padding:10px 16px;font-weight:500;color:var(--text-2)}
.d-pop .mi:hover{background:var(--bg-2)}
.d-pop .mi.danger{color:var(--error)}
.d-pop .presets{display:flex;gap:6px;flex-wrap:wrap}
.d-pill{height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--border);background:#fff;font-size:13px;font-weight:500;color:var(--text-2)}
.d-pill.on{background:var(--brand-50);border-color:var(--brand);color:var(--brand-700)}
.d-ovl{position:fixed;inset:0;z-index:300;background:rgba(10,13,18,.6);backdrop-filter:blur(3px);display:grid;place-items:center;padding:24px;animation:fadeIn .15s}
.d-mod{background:#fff;border-radius:12px;box-shadow:0 20px 24px -4px rgba(10,13,18,.1),0 8px 8px -4px rgba(10,13,18,.04);width:640px;max-width:100%;max-height:calc(100vh - 48px);display:flex;flex-direction:column}
.d-mod.sm{width:420px}.d-mod.lg{width:960px}.d-mod.xl{width:1180px}
.d-mod .mh{display:flex;align-items:flex-start;gap:12px;padding:20px 24px 16px;border-bottom:1px solid var(--border-2)}
.d-mod .mh.nob{border-bottom:0;padding-bottom:4px}
.d-mod .mh .tt{flex:1;display:grid;gap:4px}
.d-mod .mh h3{font-size:18px;line-height:28px;font-weight:600}
.d-mod .mh p{color:var(--text-3)}
.d-mod .mb{padding:20px 24px;overflow:auto;display:grid;gap:16px;align-content:start}
.d-mod .mf{display:flex;justify-content:flex-end;align-items:center;gap:12px;padding:16px 24px;border-top:1px solid var(--border-2)}
.d-mod .mf.split{justify-content:space-between}
.d-mod .mf.nob{border-top:0}
.d-drw{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:100%;background:#fff;box-shadow:var(--sh-lg);display:flex;flex-direction:column;animation:slideIn .2s}
@keyframes slideIn{from{transform:translateX(30%);opacity:.5}to{transform:none;opacity:1}}
.d-ovl.drw{display:block;padding:0}
.d-drw .mh{display:flex;gap:12px;align-items:flex-start;padding:20px 24px;border-bottom:1px solid var(--border-2)}
.d-drw .mh .tt{flex:1}
.d-drw .mh h3{font-size:18px;line-height:28px;font-weight:600}
.d-drw .mh p{color:var(--text-3);font-size:13px}
.d-drw .mb{flex:1;overflow:auto;padding:16px 24px;display:grid;gap:16px;align-content:start}
.d-drw .grp{display:grid;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--border-2)}
.d-drw .grp:last-child{border-bottom:0}
.d-drw .grp>.gt{font-size:13px;font-weight:600;color:var(--text-3)}
.d-drw .mf{display:flex;justify-content:space-between;padding:16px 24px;border-top:1px solid var(--border-2)}

.d-toast .ok{color:var(--success)}
.d-toast .msg{flex:1}

.d-calc{display:grid;grid-template-columns:minmax(0,1fr) 340px;border-top:1px solid var(--border-2)}
.d-calc>div{padding:20px 24px}
.d-calc>div+div{border-left:1px solid var(--border-2)}
.d-ac3 .d-t th,.d-ac3 .d-t td{padding:8px;font-size:12px}
.d-ac3>*{min-width:0}.d-box{min-width:0;overflow:hidden}.d-box .d-chk{align-items:flex-start;line-height:18px}
.d-ac3{display:grid;grid-template-columns:260px minmax(0,1fr) 300px;gap:12px;align-items:start}
.d-box{border:1px solid var(--border-2);border-radius:12px;background:#fff;box-shadow:var(--sh-xs)}
.d-box .bt{padding:12px 14px;border-bottom:1px solid var(--border-2);font-size:13px;font-weight:600;color:var(--text-2)}
.d-box .bt small{display:block;font-weight:400;color:var(--text-3);font-size:12px}
.d-box .bb{padding:12px 14px;display:grid;gap:12px}
.d-comp{display:grid;grid-template-columns:minmax(0,1fr) auto 96px;gap:8px;align-items:center}
.d-comp .calc{height:36px;border:1px solid var(--border-2);background:var(--bg-2);border-radius:8px;padding:0 10px;display:flex;align-items:center;color:var(--text-3)}
.d-comp .calc small{display:block}
.d-seg{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;height:28px}
.d-seg button{border:0;background:#fff;padding:0 8px;font-size:12px;font-weight:600;color:var(--text-3)}
.d-seg button.on{background:var(--brand);color:#fff}
.d-comp .d-inp{height:36px;padding:0 8px}
.d-sub{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:8px;background:var(--brand-50);color:var(--brand-700);font-weight:600}
.d-sub.ok{background:var(--success-50);color:var(--success-700)}
.d-tot{border:1px solid #c7d7fe;background:#eef4ff;border-radius:10px;padding:10px 16px;text-align:right}
.d-tot small{display:block;color:var(--brand-700);font-size:12px}
.d-tot b{font-size:22px;line-height:30px;color:var(--brand-700);font-variant-numeric:tabular-nums}
.d-tot.ok{background:var(--success-50);border-color:var(--success-200)}
.d-tot.ok small,.d-tot.ok b{color:var(--success-700)}
.d-bar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--border-2);padding:12px 32px;margin:24px -32px -56px;display:flex;align-items:center;gap:12px;z-index:5}
.d-bar .sp{flex:1}
.d-parc{border:1px solid var(--border-2);border-radius:8px;padding:10px;display:grid;gap:8px;background:var(--bg-2)}
.d-parc .pr{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:8px}

/* relatório */
.d-rep{border:1px solid var(--border-2);border-radius:12px;padding:20px;box-shadow:var(--sh-xs)}
.d-rep .rh{display:flex;gap:16px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--border-2);margin-bottom:12px;color:var(--text-3);font-size:12px}
.d-rep .rh b.l{font-size:22px;color:var(--brand);font-weight:800;letter-spacing:-.02em}
.d-rep .grp td{color:var(--text);font-weight:600;background:#fff}
.d-rep .subt td{color:var(--text);font-weight:600}
.d-rep .tot{display:flex;flex-wrap:wrap;gap:16px;padding-top:12px;margin-top:4px;border-top:1px solid var(--border-2);font-size:12px;color:var(--text-3)}
.d-rep .tot b{color:var(--text)}
.d-ms{position:relative}
.d-ms .d-inp{cursor:pointer}
.d-ms .val{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.d-crow{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:12px 16px;border-top:1px solid var(--border-2)}
.d-crow:hover{background:var(--bg-2)}
.d-crow .b{flex:1;display:grid}
.d-crow .b b{font-weight:600;color:var(--text)}
.d-crow .b span{font-size:12px;color:var(--text-3)}

.d-acc{border:1px solid var(--border-2);border-radius:12px;background:#fff;box-shadow:var(--sh-xs);margin-bottom:8px}
.d-acc>button{width:100%;border:0;background:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;font-weight:600;color:var(--text);text-align:left}
.d-acc .ab{padding:0 16px 14px;color:var(--text-3)}
.d-acc .ab:before{content:"";display:block;height:1px;background:var(--border-2);margin-bottom:12px}
.d-acc .chev{transition:transform .2s;color:var(--text-4);display:grid}
.d-acc.open .chev{transform:rotate(180deg)}
.d-chan{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-top:1px solid var(--border-2)}
.d-chan:first-child{border-top:0}
.d-chan .b{display:grid;gap:2px}
.d-chan .b b{font-weight:600;color:var(--text)}
.d-chan .b span{color:var(--text-3)}

.d-note{display:inline-grid;place-items:center;width:20px;height:20px;padding:0;border-radius:999px;border:1px solid #fedf89;background:#fffaeb;color:#b54708;vertical-align:middle;cursor:help;flex:none}

.d-proto{position:fixed;left:16px;bottom:16px;z-index:250}
.d-proto>button{height:32px;border-radius:999px;border:1px solid var(--border);background:#fff;box-shadow:var(--sh-lg);padding:0 12px;font-size:12px;font-weight:600;color:var(--text-2);display:inline-flex;align-items:center;gap:6px}

.d-ppanel{width:380px;max-height:70vh;overflow:auto}

.d-ppanel .warn{border:1px solid #fedf89;background:#fffaeb;color:#93370d;border-radius:8px;padding:8px 10px;font-size:12px;line-height:17px}

function initScrollHints(root){
  $$('.hscroll',root).forEach(h=>{
    if(h.nextElementSibling&&h.nextElementSibling.classList.contains('dots')) return;
    const n=h.children.length; const d=document.createElement('div'); d.className='dots'; d.setAttribute('aria-hidden','true');
    d.innerHTML=Array.from({length:n},(_,i)=>`<i class="${i?'':'on'}"></i>`).join(''); h.after(d);
    const upd=()=>{const w=h.children[0].offsetWidth+12; let i=Math.round(h.scrollLeft/w); if(h.scrollLeft+h.clientWidth>=h.scrollWidth-2) i=n-1; [...d.children].forEach((x,j)=>x.classList.toggle('on',j===i));};
    h.addEventListener('scroll',upd,{passive:true});
  });
  $$('#u-pills,#b-pills,.tabs,#m-pre,#d-pre',root).forEach(p=>{
    p.classList.add('fade');
    const upd=()=>p.classList.toggle('at-end',p.scrollLeft+p.clientWidth>=p.scrollWidth-2);
    if(!p.dataset.hint){p.dataset.hint='1';p.addEventListener('scroll',upd,{passive:true});}
    requestAnimationFrame(upd);
  });
}

/* ================= unidades: filtros ================= */
function fMeses(m){return m.preset!=null||m.min!=null||m.max!=null;}
function fValor(v){return v.min!=null||v.max!=null;}
function matchUnit(u,F,q){
  if(q){const t=(u.condo+' '+u.bloco+' '+u.un+' '+u.ind+' '+u.id).toLowerCase(); if(!t.includes(q.toLowerCase())) return false;}
  const m=F.meses;
  if(m.preset!=null && u.meses<m.preset) return false;
  if(m.min!=null && u.meses<m.min) return false;
  if(m.max!=null && u.meses>m.max) return false;
  const v=F.valor;
  if(fValor(v)){ if(u.valor==null) return false; if(v.min!=null&&u.valor<v.min) return false; if(v.max!=null&&u.valor>v.max) return false; }
  if(F.situacao.length&&!F.situacao.some(v=>(v==='com'&&u.procs.length>0)||(v==='sem'&&!u.procs.length)||(v==='outro'&&u.outro))) return false;
  if(F.advs.length&&!F.advs.includes(u.adv)) return false;
  return true;
}
function unitsFiltered(F=S.F,q=S.q){
  const r=UNITS.filter(u=>matchUnit(u,F,q));
  if(F.ordem!=='padrao') r.sort((a,b)=>a.condo.localeCompare(b.condo,'pt-BR')*(F.ordem==='za'?-1:1));
  return r;
}
function anyUnitFilter(F=S.F){return F.ordem!=='padrao'||fMeses(F.meses)||fValor(F.valor)||F.situacao.length>0||F.advs.length>0;}
function pillDefs(){
  const F=S.F,m=F.meses,v=F.valor;
  let ml='Meses de inadimplência';
  if(m.preset!=null) ml=m.preset===1?'1+ mês':m.preset+'+ meses';
  else if(m.min!=null&&m.max!=null) ml=`${m.min} a ${m.max} meses`;
  else if(m.min!=null) ml=`A partir de ${plural(m.min,'mês','meses')}`;
  else if(m.max!=null) ml=`Até ${plural(m.max,'mês','meses')}`;
  let vl='Valor da ação';
  if(v.min!=null&&v.max!=null) vl=`${brl(v.min)} – ${brl(v.max)}`; else if(v.min!=null) vl='A partir de '+brl(v.min); else if(v.max!=null) vl='Até '+brl(v.max);
  const SL={sem:'Sem processo',com:'Com processo',outro:'Não pertence ao escritório'}; const sl=F.situacao.length?SL[F.situacao[0]]+(F.situacao.length>1?' +'+(F.situacao.length-1):''):'Processo';
  const al=F.advs.length?F.advs[0]+(F.advs.length>1?' +'+(F.advs.length-1):''):'Advogado';
  const list=[
    {id:'situacao',label:sl,on:F.situacao.length>0},
    {id:'advogado',label:al,on:F.advs.length>0},
    {id:'valor',label:vl,on:fValor(v)},
    {id:'meses',label:ml,on:fMeses(m)},
    {id:'ordenar',label:F.ordem==='za'?'Condomínio (Z–A)':F.ordem==='az'?'Condomínio (A–Z)':'Ordenar',on:F.ordem!=='padrao'}
  ];
  const order=['ordenar','meses','valor','situacao','advogado'];
  const on=list.filter(p=>p.on).sort((a,b)=>['situacao','advogado','valor','meses','ordenar'].indexOf(a.id)-['situacao','advogado','valor','meses','ordenar'].indexOf(b.id));
  const off=list.filter(p=>!p.on).sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));
  return on.concat(off);
}
function pillsHTML(defs,act){return defs.map(p=>`<button type="button" class="pill ${p.on?'on':''}" data-act="${act}" data-f="${p.id}">${p.label}${ic('cd',16,2)}</button>`).join('');}

function updateUnidades(el){

function procLabel(a){

  const sem=a.includes('__sem'), ps=a.filter(x=>x!=='__sem'), com=procs.length>0&&procs.every(p=>ps.includes(p));
  if(sem&&com) return 'Com e sem processo';
  if(sem&&!ps.length) return 'Sem processo';
  if(com&&!sem) return 'Com processo';
  const first=sem?'Sem processo':ps[0].slice(0,12)+'…'; const n=(sem?1:0)+ps.length-1; return first+(n>0?' +'+n:'');
}

const reqList=v=>{const R=[[v.length>=8,'Mínimo 8 caracteres'],[/[A-Z]/.test(v),'Letra maiúscula'],[/[a-z]/.test(v),'Letra minúscula'],[/\d/.test(v),'Número'],[/[^A-Za-z0-9]/.test(v),'Caractere especial (!@#$...)']];return {ok:R.every(r=>r[0]),html:`<div class="req">${R.map(([o,l])=>`<div><span class="${o?'ok':'no'}">${ic(o?'okc':'xc',16)}</span>${l}</div>`).join('')}</div>`};};

function newPasswordScreen({title,sub,cta,next,backLink}){
  return {
    html:()=>`<div class="auth"><div class="brand">${LOGO('logo logo-lg')}</div><div class="form"><div class="head"><h2>${title}</h2><p>${sub}</p></div>
      <div class="field"><label for="np1">Nova senha</label><div class="inp" id="np1w"><input id="np1" type="password" autocomplete="new-password" placeholder="••••••••"><button type="button" class="eye" data-act="eye" aria-label="Mostrar senha">${ic('eyeoff',16)}</button></div><div id="np-req"></div></div>
      <div class="field"><label for="np2">Confirmar nova senha</label><div class="inp" id="np2w"><input id="np2" type="password" autocomplete="new-password" placeholder="••••••••"><button type="button" class="eye" data-act="eye" aria-label="Mostrar senha">${ic('eyeoff',16)}</button></div><span class="hint err" id="np-err" hidden>As senhas não coincidem</span></div>
      <button type="button" class="btn primary lg full" id="np-save" disabled>${cta}</button>
      ${backLink?`<button type="button" class="link gray" data-act="to-login">Voltar para o login</button>`:''}</div></div>`,
    mount(el){
      const a=$('#np1',el),b=$('#np2',el),save=$('#np-save',el);
      const sync=()=>{const r=reqList(a.value);$('#np-req',el).innerHTML=a.value?r.html:'';const mis=b.value&&b.value!==a.value;$('#np-err',el).hidden=!mis;$('#np2w',el).classList.toggle('err',!!mis);save.disabled=!(r.ok&&b.value===a.value);};
      a.addEventListener('input',sync);b.addEventListener('input',sync);
      save.addEventListener('click',next);
    }
  };
}
function codeScreen({title,sub,icon,after,backAct,expire}){
  return {
    html:()=>`<div class="auth"><div class="brand">${LOGO('logo logo-lg')}</div><div class="form"><div class="head center" style="justify-items:center"><span class="fi brand" style="width:48px;height:48px;margin-bottom:12px">${ic(icon,24)}</span><h2>${title}</h2><p>${sub}</p></div>
      <div class="code" id="code">${Array.from({length:6},(_,i)=>`<input inputmode="numeric" maxlength="1" placeholder="0" aria-label="Dígito ${i+1}">`).join('')}</div>
      ${expire?`<p class="hint" style="text-align:center;margin:0">${expire}</p>`:''}
      <button type="button" class="btn primary lg full" id="code-ok" disabled>Verificar código</button>
      <div class="links"><button type="button" class="link gray" data-act="${backAct}">${backAct==='back'?'Voltar':'Voltar para o login'}</button><button type="button" class="link gray" disabled>Reenviar código</button></div></div></div>`,
    mount(el){
      const ins=$$('#code input',el),ok=$('#code-ok',el);
      const sync=()=>{ok.disabled=!ins.every(i=>/\d/.test(i.value));};
      ins.forEach((inp,i)=>{
        inp.addEventListener('input',()=>{inp.value=inp.value.replace(/\D/g,'').slice(-1);if(inp.value&&ins[i+1])ins[i+1].focus();sync();});
        inp.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!inp.value&&ins[i-1]){ins[i-1].focus();}});
        inp.addEventListener('paste',e=>{const t=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,6);if(!t)return;e.preventDefault();t.split('').forEach((c,j)=>{if(ins[j])ins[j].value=c;});sync();});
      });
      ok.addEventListener('click',after);
    }
  };
}

let popEl=null, popAnchor=null, ovEl=null, toastEl=null, toastT=null;
function closePop(){ if(popEl){popEl.remove();popEl=null;} if(popAnchor){popAnchor.classList.remove('on');popAnchor.setAttribute('aria-expanded','false');popAnchor=null;} }
function openPop(anchor,html,{cls='',onMount,align='left',width}={}){
  const same=popAnchor===anchor; closePop(); if(same) return null;
  popEl=document.createElement('div'); popEl.className='d-pop '+cls; popEl.setAttribute('role','dialog'); popEl.innerHTML=html;
  if(width) popEl.style.width=width+'px';
  document.body.appendChild(popEl);
  const r=anchor.getBoundingClientRect(), pw=popEl.offsetWidth;
  let left=align==='right'?r.right-pw:r.left; left=Math.max(8,Math.min(left,window.innerWidth-pw-8));
  let top=r.bottom+6; const ph=popEl.offsetHeight; if(top+ph>window.innerHeight-8&&r.top-ph-6>8) top=r.top-ph-6;
  popEl.style.left=(left+window.scrollX)+'px'; popEl.style.top=(top+window.scrollY)+'px';
  popAnchor=anchor; if(anchor.classList.contains('d-btn')) anchor.classList.add('on'); anchor.setAttribute('aria-expanded','true');
  if(onMount) onMount(popEl);
  const f=popEl.querySelector('input,button'); if(f&&cls.indexOf('nofocus')<0) setTimeout(()=>{try{f.focus({preventScroll:true});}catch(e){}},0);
  return popEl;
}
document.addEventListener('mousedown',e=>{ if(!popEl) return; if(popEl.contains(e.target)||(popAnchor&&popAnchor.contains(e.target))) return; closePop(); },true);
window.addEventListener('resize',closePop); window.addEventListener('scroll',()=>{ if(popEl&&!popEl.classList.contains('stay')) closePop(); },true);

function openModal({title,sub='',body,foot='',size='',cls='',onMount,drawer=false,nob=false}){
  closeModal(); closePop();

  const head=`<div class="mh ${nob?'nob':''}"><div class="tt"><h3 id="d-mt">${title}</h3>${sub?`<p>${sub}</p>`:''}</div><button type="button" class="d-ibtn plain" data-d="close" aria-label="Fechar">${X('x',20)}</button></div>`;
  ovEl.innerHTML=`<div class="${drawer?'d-drw':'d-mod '+size} ${cls}" role="dialog" aria-modal="true" aria-labelledby="d-mt">${head}<div class="mb">${body}</div>${foot?`<div class="mf">${foot}</div>`:''}</div>`;
  document.body.appendChild(ovEl);
  const box=ovEl.firstElementChild;
  if(onMount) onMount(box);
  setTimeout(()=>{const f=box.querySelector('.mb input:not([disabled]),.mb select'); if(f) f.focus({preventScroll:true}); else box.querySelector('[data-d=close]').focus({preventScroll:true});},0);
  return box;

function toast(msg){

  toastEl=document.createElement('div'); toastEl.className='d-toast'; toastEl.setAttribute('role','status');
  toastEl.innerHTML=`<span class="ok">${X('okc',20)}</span><span class="msg">${msg}</span><button type="button" class="d-ibtn plain" aria-label="Fechar aviso">${X('x',16)}</button>`;

  document.body.appendChild(toastEl); toastT=setTimeout(()=>{if(toastEl){toastEl.remove();toastEl=null;}},3600);
}

function checkPop(a,{title,opts,cur,onApply,width=300}){

/* ---------- unidades: dados filtrados ---------- */
function matchU(u,F,q){
  if(q){const t=[u.condo,u.bloco,u.un,u.ind,u.id,u.cnpj,u.doc].concat(u.procs).join(' ').toLowerCase(); if(!t.includes(q.toLowerCase())) return false;}
  const m=F.meses; if(m.preset!=null&&u.meses<m.preset) return false; if(m.min!=null&&u.meses<m.min) return false; if(m.max!=null&&u.meses>m.max) return false;
  const v=F.valor; if(v.min!=null||v.max!=null){ if(u.valor==null) return false; if(v.min!=null&&u.valor<v.min) return false; if(v.max!=null&&u.valor>v.max) return false; }
  if(F.proc.length&&!F.proc.some(x=>(x==='com'&&u.procs.length>0)||(x==='sem'&&!u.procs.length)||(x==='outro'&&u.outro))) return false;
  if(F.advs.length&&!F.advs.some(a=>u.advs.includes(a))) return false;
  return true;
}
const anyUF=F=>hasRange(F.meses)||F.valor.min!=null||F.valor.max!=null||F.proc.length||F.advs.length;
const dnum=s=>{const [d,m,y]=s.split('/').map(Number);return y*10000+m*100+d;};
function unitsList(base,F,q,sort){
  const r=base.filter(u=>matchU(u,F,q));
  if(sort&&sort.k){const k=sort.k;r.sort((a,b)=>{let x,y;if(k==='condo'){x=a.condo;y=b.condo;return x.localeCompare(y,'pt-BR')*sort.dir;} if(k==='rec'){x=dnum(a.rec);y=dnum(b.rec);} if(k==='valor'){x=a.valor||0;y=b.valor||0;} if(k==='meses'){x=a.meses;y=b.meses;} return (x-y)*sort.dir;});}
  return r;
}
const PROC_L={sem:'Sem processo',com:'Com processo',outro:'Não pertence ao escritório'};
function unitFilterBar(scope){
  const F=scope==='u'?D.uf:D.cuf;
  return `<div class="d-inp"><span>${X('search',18)}</span><input type="search" data-d-in="${scope}q" placeholder="${scope==='u'?'Buscar unidade, condomínio ou nome':'Buscar unidade ou nome'}" aria-label="Buscar unidade" value="${esc(scope==='u'?D.uq:D.cuq)}"></div>
  ${filterBtn(scope+'-meses',rangeLabel(F.meses,'Meses de inadimplência',['mês','meses']),hasRange(F.meses))}
  ${filterBtn(scope+'-valor',moneyLabel(F.valor,'Débito da unidade'),F.valor.min!=null||F.valor.max!=null)} ${note('valor')}
  <span class="sp"></span>
  ${filterBtn(scope+'-proc',listLabel(F.proc,'Processo',PROC_L),F.proc.length>0)}
  ${filterBtn(scope+'-adv',listLabel(F.advs,'Advogado'),F.advs.length>0)}`;
}
function openUnitFilter(a,id){
  const scope=id.split('-')[0], k=id.split('-')[1], F=scope==='u'?D.uf:D.cuf;
  const done=()=>{ if(scope==='u') D.usel.clear(); else D.cusel.clear(); render(true); };
  if(k==='meses') rangePop(a,{title:'Meses de inadimplência',presets:[1,3,6,12],unit:['mês','meses'],hint:'Em meses de atraso.',cur:F.meses,onApply:d=>{F.meses=d;done();}});
  if(k==='valor') moneyPop(a,{title:'Débito da unidade',cur:F.valor,onApply:d=>{F.valor=d;done();}});
  if(k==='proc') checkPop(a,{title:'Processo',opts:[['sem','Sem processo'],['com','Com processo'],['outro','Não pertence ao escritório']],cur:F.proc,onApply:d=>{F.proc=d;done();}});
  if(k==='adv') checkPop(a,{title:'Advogado',opts:ADVS_D.map(x=>[x,x]),cur:F.advs,onApply:d=>{F.advs=d;done();}});
}
function unitRows(list,scope){
  const sel=scope==='u'?D.usel:D.cusel, full=scope==='u';
  return list.map(u=>{const on=sel.has(u.id);
    const pr=u.procs.length>1?`<div class="two"><span class="d-chip" style="justify-self:start">${plural(u.procs.length,'processo','processos')}</span><span class="trunc">${u.procs.join(', ')}</span></div>`:u.procs.length?`<span class="lnk trunc">${u.procs[0]}</span>`:'—';
    return `<tr class="click ${on?'sel':''}" data-d="openunit" data-id="${u.id}">
      <td class="cbc">${cb(on,`data-d="usel" data-s="${scope}" data-id="${u.id}"`)}</td>
      ${full?`<td>${u.id}</td><td>${u.cnpj}</td><td class="strong" style="font-size:15px">${u.condo}</td>`:''}
      <td>${u.bloco}</td><td>${u.un}</td>
      <td><div class="two"><b class="trunc w2">${u.ind}</b><span>${u.doc}</span></div></td>
      <td>${pr}</td><td><span class="trunc">${u.advs.join(', ')}</span></td>
      <td>${u.procs.length?'<span class="d-b ok">Processo ativo</span>':'<span class="d-b warn">Sem processo</span>'}</td>
      <td>${u.rec}</td><td class="b">${u.procs.length?brl(u.valor)+' ('+u.procs.length+')':'—'}</td>
      <td><span class="d-b err sq">${plural(u.meses,'mês','meses')}</span></td>
      <td style="color:var(--text-4)">${X('cr',16)}</td></tr>`;}).join('');
}
function unitTable(scope,base){
  const F=scope==='u'?D.uf:D.cuf, q=scope==='u'?D.uq:D.cuq, sort=D.usort, sel=scope==='u'?D.usel:D.cusel;
  const list=unitsList(base,F,q,sort), any=anyUF(F)||q, full=scope==='u';

  ${thS('Unidade recebida em','rec',sort,'usort')}${thS('Valor da ação','valor',sort,'usort')}${thS('Meses de inadimplência','meses',sort,'usort')}<th aria-label="Abrir"></th></tr></thead>

}

function repDoc(c,R){

  const sum=k=>brl(rows.reduce((a,b)=>a+({'Valor original':b.n.v,'Multa':b.n.m,'Correção':b.n.c,'Juros':b.n.j,'Encargos':b.n.e,'Atualizado':b.n.sub})[k],0));

const SBADGE={'Pago':'ok','Aguardando pagamento':'warn','Aguardando emissão':'info','Vencido':'err','Cancelado':'ind','A vencer':'vio'};
function bolMatch(b,F,q){
  if(q&&!(b.t+' '+b.venc+' '+b.valor+' '+b.status).toLowerCase().includes(q.toLowerCase())) return false;
  if(F.status.length&&!F.status.includes(b.status)) return false;
  if(F.tipos.length&&!F.tipos.includes(b.tipo)) return false;
  if(F.procs.length){ const sem=F.procs.includes('__sem'); if(!(b.proc?F.procs.includes(b.proc):sem)) return false; }
  const d=F.dias; if(d.preset!=null&&b.dias<d.preset) return false; if(d.min!=null&&b.dias<d.min) return false; if(d.max!=null&&b.dias>d.max) return false;
  return true;
}
const anyBF=F=>F.status.length||F.tipos.length||F.procs.length||hasRange(F.dias);
function procFilterLabel(F,procs){ const a=F.procs; if(!a.length) return 'Processo'; const sem=a.includes('__sem'),ps=a.filter(x=>x!=='__sem'),com=procs.length&&procs.every(p=>ps.includes(p));
  if(sem&&com) return 'Com e sem processo'; if(sem&&!ps.length) return 'Sem processo'; if(com&&!sem) return 'Com processo'; return (sem?'Sem processo':ps[0].slice(0,12)+'…')+((sem?1:0)+ps.length-1>0?' +'+((sem?1:0)+ps.length-1):''); }
function bolToolbar(u,ro){
  const F=D.bf, procs=u.id===2740?[P1,P2]:u.procs.slice();
  return `<div class="d-tb" style="border-bottom:0;padding-bottom:6px"><div class="d-inp" style="flex:0 1 240px;min-width:180px"><span>${X('search',18)}</span><input type="search" data-d-in="bq" placeholder="Buscar boleto" aria-label="Buscar boleto" value="${esc(D.bq)}"></div>
    ${filterBtn('b-status',listLabel(F.status,'Status'),F.status.length>0)}${filterBtn('b-tipo',listLabel(F.tipos,'Tipo'),F.tipos.length>0)}${filterBtn('b-proc',procFilterLabel(F,procs),F.procs.length>0)}${ro?'':filterBtn('b-dias',rangeLabel(F.dias,'Dias em atraso',['dia','dias']),hasRange(F.dias))}</div>
  ${ro?'':`<div class="d-tb" style="padding-top:6px" data-part="bacts">${bolActs()}</div>`}`;
}
function bolActs(){const n=D.bsel.size;return `<button type="button" class="d-btn sec sm" data-d="nv" ${n?'':'disabled'}>${X('cal',16)}Novo vencimento</button><button type="button" class="d-btn sec sm" data-d="na" ${n?'':'disabled'}>${X('thumb',16)}Novo acordo</button>${note('juridico')}<span class="sep"></span>
  <button type="button" class="d-btn sec sm" data-d="extrato">${X('filetext',16)}Extrato de cobrança</button><button type="button" class="d-ibtn" data-d="bmore" aria-label="Mais ações" aria-haspopup="menu">${X('dots',16,3)}</button><button type="button" class="d-ibtn ${D.busy?'busy':''}" data-d="brefresh" aria-label="Atualizar boletos" ${D.busy?'disabled':''}>${X('refresh',16)}</button>${n?`<span class="d-hint">${plural(n,'boleto selecionado','boletos selecionados')}</span>`:''}`;}
function bolTable(u,ro){
  const all=bolsOf(u), list=all.filter(b=>bolMatch(b,D.bf,D.bq)), any=anyBF(D.bf)||D.bq;
  const selectable=list.filter(b=>!b.ced).map(b=>b.i), n=selectable.filter(i=>D.bsel.has(i)).length;
  const res=`<div class="d-res" style="border-top:1px solid var(--border-2)"><b>${plural(list.length,'boleto','boletos')}</b>${any?`<button type="button" class="d-link" data-d="bclear">Limpar filtros</button>`:''}</div>`;
  if(!list.length) return res+emptyBox('Nenhum boleto encontrado','Altere os filtros selecionados e tente novamente.',`<button type="button" class="d-btn sec" data-d="bclear">Limpar filtros</button>`);
  return res+`<div class="d-tw ${D.busy?'busy-list':''}"><table class="d-t"><thead><tr>${ro?'':`<th class="cbc">${cbAll(n,selectable.length,'ball')}</th>`}<th>Referência</th><th>Vencimento (dias em atraso)</th><th>Valor</th><th>Multa</th><th>Juros</th><th>Correção</th><th>Encargo</th><th>Adicionais</th><th>Subtotal</th><th>Total</th><th>Data de pagamento</th><th>Valor pago ${b0Note()}</th><th>Competências relac.</th><th>No processo</th><th>Status</th>${ro?'':'<th>Ação</th>'}</tr></thead><tbody>
  ${list.map(b=>{const on=!ro&&D.bsel.has(b.i);return `<tr class="${on?'sel':''}">${ro?'':`<td class="cbc">${b.ced?`<span class="ced" title="Boleto cedido: não pode ser selecionado">${X('ban',16)}</span>`:cb(on,`data-d="bsel" data-i="${b.i}"`)}</td>`}
    <td><span class="ref"><span class="z">${X('zap',14)}</span>${b.t}</span></td><td>${b.venc}${b.dias>0&&b.status!=='A vencer'?`<span class="d-dd">${b.dias}D</span>`:''}</td>
    <td>${b.valor}</td><td>${b.multa}</td><td>${b.juros}</td><td>${b.corr}</td><td>${b.enc}</td><td>${b.adic}</td><td class="b">${b.sub}</td><td class="b">${b.total}</td><td>${b.pag}</td><td style="${b.status==='Pago'?'color:var(--success)':''}">${b.pago}</td><td>${b.comp}</td>
    <td>${b.proc?`<span class="d-chip" title="${b.proc}">${X('scales',12)}…${b.proc.slice(-7)}</span>`:'—'}</td>
    <td><span style="display:inline-flex;gap:4px"><span class="d-b ${SBADGE[b.status]||'gray'}">${b.status}</span>${b.ced?'<span class="d-b warn">Cedido</span>':''}</span></td>
    ${ro?'':`<td>${b.ced?'':`<button type="button" class="d-ibtn plain" data-d="brow" data-i="${b.i}" aria-label="Ações do boleto ${b.t}" aria-haspopup="menu">${X('dots',16,3)}</button>`}</td>`}</tr>`;}).join('')}</tbody></table></div>`;
}

const COMPS=[['j','Juros'],['c','Correção monetária'],['e','Encargos'],['m','Multa']];
function calcState(u){ const bs=bolsOf(u).filter(b=>D.bsel.has(b.i)); return {bs,desc:{j:{t:'R$',v:0},c:{t:'R$',v:0},e:{t:'R$',v:0},m:{t:'R$',v:0},tar:{t:'R$',v:0},acr:{t:'R$',v:0}},isTar:false,venc:'',parc:3,datas:{},opt1:true,opt2:false}; }
function calcTotals(C){
  const base=k=>C.bs.reduce((a,b)=>a+b.n[k],0), dval=(k,amt)=>{const d=C.desc[k];return Math.min(amt,d.t==='%'?amt*d.v/100:d.v);};
  const v=base('v'); let sub=v; COMPS.forEach(([k])=>{const a=base(k);sub+=a-dval(k,a);});
  const tar=C.isTar?0:3.98-dval('tar',3.98); const tot=Math.max(0,sub+tar);
  return {v,sub,tar,tot,base};
}

/* ---------- API para a troca de fluxo ---------- */
const MOBILE_EQ=['unidades','unidade','perfil','suporte'];
window.DESK={
  snapshot(){ const n=D.r.n, p=D.r.p;
    if(AUTH.includes(n)) return {logged:false,screen:n};

};

<script>
/* ================= TROCA DE FLUXO (desktop ⇄ mobile) =================
   Abaixo de 1024 px, ou em celular/tablet, mostra só o fluxo mobile (consulta).
   Ao cruzar o breakpoint, vai para a tela equivalente do outro fluxo. */
(function(){
'use strict';
function isHandheld(){
  const ua=navigator.userAgent||'';
  if(/Android|iPhone|iPod|iPad|Windows Phone|Mobile/i.test(ua)) return true;
  const touchOnly=window.matchMedia&&matchMedia('(pointer:coarse)').matches&&!matchMedia('(any-pointer:fine)').matches;
  return !!(touchOnly&&navigator.maxTouchPoints>0); /* iPad em modo "computador" */
}
const want=()=>(window.innerWidth<1024||isHandheld())?'mobile':'desktop';
function apply(first){
  const m=want(); if(m===SHELL.mode) return;
  const prev=SHELL.mode;
  const snap=first?{logged:false,screen:'login'}:(prev==='mobile'?MOB.snapshot():DESK.snapshot());
  if(prev==='mobile') MOB.leave(); if(prev==='desktop') DESK.leave();
  SHELL.mode=m;
  document.documentElement.classList.toggle('m-mode',m==='mobile');
  document.documentElement.classList.toggle('d-mode',m==='desktop');
  window.scrollTo(0,0);
  (m==='mobile'?MOB:DESK).enter(snap);
}
let t; window.addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(()=>apply(false),120);});
apply(true);
})();
</script>
