<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal Jurídico Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: no computador, o celular (375×812) fica centralizado ao lado de um painel de roteiro de teste;
   no celular, o app ocupa a tela inteira. Tokens = LLZ-DS (valores lidos das variáveis do Figma). */
:root{
  --brand:#004aeb; --brand-700:#003084; --brand-soft:rgba(0,74,235,.10); --brand-50:#eff4ff; --brand-ring:rgba(0,74,235,.24);
  --bg:#ffffff; --bg-2:#fafafa; --bg-3:#f5f5f5;
  --border:#d5d7da; --border-2:#e9eaeb;
  --text:#181d27; --text-2:#414651; --text-3:#535862; --text-4:#717680; --ph:#a4a7ae;
  --error:#d92d20; --error-700:#b42318; --error-50:#fef3f2; --error-200:#fecdca; --error-bg:#fee4e2;
  --success:#079455; --success-700:#067647; --success-50:#ecfdf3; --success-200:#abefc6; --success-bg:#dcfae6;
  --warning:#dc6803; --warning-bg:#fef0c7;
  --gb-50:#f8f9fc; --gb-200:#d5d9eb; --gb-700:#363f72;
  --overlay:rgba(10,13,18,.7);
  --backdrop:#e6eaf2; --panel:#ffffff; --device-edge:#11151c;
  --r-sm:6px; --r-md:8px; --r-lg:10px; --r-xl:12px; --r-2xl:16px;
  --sh-xs:0 1px 2px rgba(10,13,18,.05);
  --sh-lg:0 12px 16px -4px rgba(10,13,18,.08),0 4px 6px -2px rgba(10,13,18,.03);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --sb:59px; --hi:34px;
  color-scheme:light;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--backdrop);color:var(--text);font-family:var(--font);font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ---------- stage (desktop) ---------- */
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));flex-wrap:wrap}
.panel{width:300px;max-width:100%;display:grid;gap:20px;align-content:start}
.panel h1{margin:0;font-size:24px;line-height:32px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.panel p{margin:0;color:var(--text-3)}
.panel .eyebrow{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-700)}
.pbox{background:var(--panel);border:1px solid var(--border-2);border-radius:var(--r-xl);padding:16px;display:grid;gap:10px}
.pbox h2{margin:0;font-size:14px;line-height:20px;font-weight:600}
.pbox ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.pbox li{display:grid;gap:2px;color:var(--text-3);font-size:13px;line-height:18px}
.pbox code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--text);background:var(--bg-3);padding:1px 6px;border-radius:4px;justify-self:start}
.jump{display:flex;flex-wrap:wrap;gap:8px}
.jump button{border:1px solid var(--border);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;color:var(--text-2)}
.jump button:hover{border-color:var(--brand);color:var(--brand-700)}
.pnote{font-size:12px;line-height:16px;color:var(--text-4)}

.dwrap{width:375px;flex:none;transform-origin:top center}
.device{position:relative;width:375px;height:812px;border-radius:52px;overflow:hidden;background:var(--bg);
  box-shadow:0 0 0 11px var(--device-edge),0 0 0 12px #2a303b,0 40px 80px -20px rgba(10,13,18,.35)}
.sbar{position:absolute;top:0;left:0;right:0;height:var(--sb);z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 44px;font-weight:600;font-size:16px;pointer-events:none}
.sbar .island{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000}
.sbar .sic{display:flex;gap:6px;align-items:center}
.hind{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#000;z-index:70;pointer-events:none}
.host{position:absolute;top:var(--sb);left:0;right:0;bottom:0;overflow:hidden}

@media (max-width:520px){
  body{background:var(--bg)}
  :root{--sb:0px;--hi:0px}
  .stage{display:block;height:100%;padding:0;min-height:0}
  .panel{display:none}
  .dwrap{width:100%;height:100%;transform:none!important}
  .device{width:100%;height:100%;border-radius:0;box-shadow:none}
  .sbar,.hind{display:none}
}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;background:var(--bg);padding-bottom:calc(var(--hi) + 16px);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.screen::-webkit-scrollbar{display:none}
.anim-push{animation:pushIn .28s cubic-bezier(.2,.7,.2,1)}
.anim-pop{animation:popIn .24s cubic-bezier(.2,.7,.2,1)}
.anim-fade{animation:fadeIn .2s ease-out}
@keyframes pushIn{from{transform:translateX(40%);opacity:.4}to{transform:none;opacity:1}}
@keyframes popIn{from{transform:translateX(-25%);opacity:.5}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.pad{padding-left:16px;padding-right:16px}
.stack{display:grid;gap:16px}
.appbar{position:sticky;top:0;z-index:6;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 16px;background:var(--bg);border-bottom:1px solid var(--border-2)}
.appbar.center{padding:0 8px;display:grid;grid-template-columns:40px 1fr 40px}
.appbar.center h1{margin:0;text-align:center;font-size:16px;line-height:24px;font-weight:600}
.ibtn{width:40px;height:40px;border:0;background:transparent;border-radius:var(--r-md);display:grid;place-items:center;color:var(--text-4)}
.ibtn:active{background:var(--bg-3)}
.logo{display:block;height:24px;width:auto;color:var(--brand)}
.logo-lg{height:40px}

h2.h-page{margin:0;font-size:20px;line-height:30px;font-weight:600;letter-spacing:-.01em}
.sub{margin:0;color:var(--text-3);font-size:14px}
.muted{color:var(--text-4)}

/* indicators */
.hscroll{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:0 16px;scroll-snap-type:x mandatory;scroll-padding:16px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.kpi{flex:none;width:200px;height:165px;background:var(--bg-3);border-radius:var(--r-xl);padding:16px;display:flex;flex-direction:column;justify-content:space-between;scroll-snap-align:start}
.kpi .kl{font-size:12px;line-height:16px;font-weight:500;color:var(--text-3)}
.kpi .kv{font-size:20px;line-height:30px;white-space:nowrap;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
.kpi .ks{font-size:12px;line-height:16px;color:var(--text-4)}
.kv.c-success{color:var(--success)} .kv.c-warning{color:var(--warning)} .kv.c-error{color:var(--error)}
.fi{width:40px;height:40px;border-radius:999px;display:grid;place-items:center;flex:none}
.fi.sm{width:32px;height:32px}
.fi.brand{background:var(--brand-soft);color:var(--brand)}
.fi.success{background:var(--success-bg);color:var(--success)}
.fi.warning{background:var(--warning-bg);color:var(--warning)}
.fi.error{background:var(--error-bg);color:var(--error)}
.fi.gray{background:var(--bg-3);color:var(--text-3)}
.fi.neutral{background:var(--bg-3);color:var(--text-2)}

/* inputs */
.field{display:grid;gap:6px}
.field label,.flabel{font-size:14px;line-height:20px;font-weight:500;color:var(--text-2)}
.inp{display:flex;align-items:center;gap:8px;height:40px;border:1px solid var(--border);border-radius:var(--r-md);background:#fff;box-shadow:var(--sh-xs);padding:0 12px;transition:border-color .15s,box-shadow .15s}
.inp:focus-within{border-color:var(--brand);box-shadow:var(--sh-xs),0 0 0 4px var(--brand-ring)}
.inp input{flex:1;min-width:0;width:100%;border:0;outline:0;background:transparent;font-size:16px;line-height:24px;color:var(--text);padding:0}
.inp input::placeholder{color:var(--ph)}
.inp .lead{color:var(--text-4);font-size:16px}
.inp .ico{color:var(--text-4);display:grid}
.inp.err{border-color:var(--error)}
.inp.err:focus-within{box-shadow:var(--sh-xs),0 0 0 4px rgba(217,45,32,.24)}
.inp.search{box-shadow:none}
.inp.search:focus-within{box-shadow:0 0 0 4px var(--brand-ring)}
.inp .eye{border:0;background:none;padding:0;color:var(--ph);display:grid}
.hint{font-size:14px;line-height:20px;color:var(--text-3)}
.hint.err{color:var(--error)}
.row2{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.row2>*{min-width:0}

/* buttons */
.btn{height:40px;border-radius:var(--r-md);border:1px solid transparent;padding:0 14px;font-size:14px;line-height:20px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;box-shadow:var(--sh-xs)}
.btn.lg{height:44px;font-size:16px}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:active{background:#0040cc}
.btn.secondary{background:#fff;border-color:var(--border);color:var(--text-2)}
.btn.secondary-color{background:#fff;border-color:rgba(0,74,235,.3);color:#013aa3}
.btn.sm{height:32px;padding:0 12px}
.cfoot-link{display:flex;justify-content:center}
.btn.danger{background:var(--error);color:#fff}
.btn.full{width:100%}
.btn:disabled{background:var(--bg-3);border-color:var(--border-2);color:var(--ph);box-shadow:none;cursor:not-allowed}
.link{border:0;background:none;padding:0;font-weight:600;font-size:14px;line-height:20px;color:var(--brand-700);justify-self:start;display:inline-flex;align-items:center;gap:4px}
.link.gray{color:var(--text-3)}
.link:disabled{color:var(--ph);cursor:not-allowed}

/* pills */
.pills{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;height:36px;padding:0 12px 0 14px;border-radius:999px;border:0;background:var(--bg-3);display:inline-flex;align-items:center;gap:4px;font-size:14px;line-height:20px;font-weight:500;color:var(--text-2);white-space:nowrap}
.pill.on{background:var(--brand-soft);color:var(--brand-700)}
.pill.static{padding:0 14px}
.pills.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}

.resrow{display:flex;align-items:center;justify-content:space-between;min-height:20px}
.resrow b{font-weight:500;color:var(--text-2)}

/* cards & fields */
.card{border:1px solid var(--border-2);border-radius:var(--r-xl);background:#fff;box-shadow:var(--sh-xs);padding:16px;display:grid;gap:12px}
button.card{width:100%;text-align:left;font:inherit;color:inherit}
.ctop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.ctitle{font-size:16px;line-height:24px;font-weight:600;color:var(--text)}
.csub{font-size:14px;line-height:20px;color:var(--text-3)}
.hr{height:1px;background:var(--border-2)}
.fld{display:grid;gap:2px;min-width:0}
.fl{font-size:14px;line-height:20px;font-weight:500;color:var(--text)}
.fv{font-size:14px;line-height:20px;color:var(--text-3);overflow-wrap:anywhere}
.fv.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;line-height:18px;font-weight:500;border:1px solid;white-space:nowrap}
.badge.sm{height:20px;font-size:12px}
.badge.error{background:var(--error-50);border-color:var(--error-200);color:var(--error-700)}
.badge.success{background:var(--success-50);border-color:var(--success-200);color:var(--success-700)}
.badge.brand{background:rgba(0,74,235,.05);border-color:rgba(0,74,235,.2);color:var(--brand-700)}
.badge.gb{background:var(--gb-50);border-color:var(--gb-200);color:var(--gb-700)}
.badge.gray{background:var(--bg-2);border-color:var(--border-2);color:var(--text-2)}
.count{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--bg-3);border:1px solid var(--border-2);font-size:12px;font-weight:500;color:var(--text-2)}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--bg-2);border:1px solid var(--border-2);border-radius:var(--r-md);padding:10px 12px;font-size:12px;line-height:18px;color:var(--text-3)}
.note svg{flex:none;margin-top:1px;color:var(--text-4)}

/* list loader */
.more{display:grid;gap:12px;justify-items:center;padding:8px 0 0}
.more span{font-size:14px;color:var(--text-3)}
.loader{display:inline-flex;gap:8px;align-items:center;min-height:40px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--border-2);border-top-color:var(--brand);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* empty */
.empty{display:grid;justify-items:center;text-align:center;gap:16px;padding:32px 16px}
.empty .ring{width:56px;height:56px;border-radius:999px;display:grid;place-items:center;background:var(--bg-3);color:var(--text-3);box-shadow:0 0 0 8px var(--bg-2)}
.empty h3{margin:0;font-size:16px;line-height:24px;font-weight:600}
.empty p{margin:0;color:var(--text-3)}

/* FAB */
.fab{position:absolute;right:16px;bottom:calc(var(--hi) + 24px);width:48px;height:48px;border-radius:999px;border:0;background:var(--brand);color:#fff;display:grid;place-items:center;box-shadow:var(--sh-lg);z-index:20;transition:transform .2s,opacity .2s}
.fab[hidden]{display:none!important}

/* detail */
.ident{padding:16px 16px 12px;display:grid;gap:2px}
.ident h2{margin:0 0 4px;font-size:20px;line-height:30px;font-weight:600}
.tabsbar{position:sticky;top:48px;z-index:5;background:var(--bg);padding:12px 16px 0;border-bottom:1px solid var(--border-2)}
.tabs{display:flex;gap:16px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;padding:0 4px 11px;font-size:14px;line-height:20px;font-weight:600;color:var(--text-4);border-bottom:2px solid transparent;margin-bottom:0;display:inline-flex;gap:8px;align-items:center}
.tabs.fade{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 24px),transparent)}
.tabs.fade.at-end{-webkit-mask-image:none;mask-image:none}
.tab.on{color:var(--brand-700);border-bottom-color:var(--brand)}
.tab:focus-visible{outline-offset:-2px;border-radius:4px}
.tabbody{padding:16px;display:grid;gap:16px}

.rec{display:flex;gap:12px;align-items:center;padding:14px 0;border:0;border-bottom:1px solid var(--border-2);background:none;width:100%;text-align:left}
.rec .rn{font-weight:600;color:var(--brand-700)}
.rec .rd{font-size:12px;line-height:16px;color:var(--text-4)}
.rec .rt{color:var(--text-3);margin-top:4px}
.rec .rb{flex:1;min-width:0;display:grid}
.rec svg{color:var(--text-4);flex:none}

.acc{border:1px solid var(--border-2);border-radius:var(--r-xl);background:#fff;box-shadow:var(--sh-xs)}
.acc>button{width:100%;border:0;background:none;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left}
.acc .at,.card .at{font-weight:600;color:var(--text)}
.acc .as{font-size:12px;line-height:18px;color:var(--text-3)}
.acc .ab{padding:0 16px 16px;display:grid;gap:12px}
.acc .chev{transition:transform .2s;color:var(--text-4);display:grid;place-items:center}
.acc.open .chev{transform:rotate(180deg)}
.chan{display:flex;align-items:center;gap:12px}
.chan-btn{border:0;background:none;padding:0;width:100%;text-align:left;align-items:flex-start;border-radius:var(--r-md)}
.chan-btn:active{background:var(--bg-2)}
.chan-btn .link{margin-top:4px}

/* menu (sidebar mobile) */
.menu{position:absolute;top:var(--sb);left:0;right:0;bottom:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .28s cubic-bezier(.2,.7,.2,1);visibility:hidden}
.menu.open{transform:none;visibility:visible}
.menu .mhead{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 16px;border-bottom:1px solid var(--border-2)}
.menu nav{padding:12px 16px;display:grid;flex:1;align-content:start}
.mitem{height:56px;padding:4px 0;border:0;background:none;width:100%}
.mitem span{height:48px;border-radius:var(--r-lg);display:flex;align-items:center;gap:12px;padding:0 16px;font-weight:500;color:var(--text-2)}
.mitem.on span{background:var(--brand-50);color:var(--brand-700)}
.mitem.on svg{color:var(--brand)}
.mitem svg{color:var(--text-4)}
.mfoot{border-top:1px solid var(--border-2);padding:16px 32px calc(var(--hi) + 16px);display:flex;align-items:center;gap:12px}
.avatar{width:40px;height:40px;border-radius:999px;background:var(--bg-3);border:1px solid rgba(0,0,0,.08);display:grid;place-items:center;font-weight:600;color:var(--text-3);flex:none}
.mfoot .who{flex:1;min-width:0;display:grid}
.mfoot .who b{font-weight:600;font-size:14px}
.mfoot .who span{color:var(--text-3)}
.mfoot .out{color:var(--error)}

/* sheets */
.ovl{position:absolute;inset:0;z-index:50;background:var(--overlay);opacity:0;transition:opacity .2s;backdrop-filter:blur(2px)}
.ovl.show{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:51;background:var(--bg);border-radius:16px 16px 0 0;max-height:calc(100% - var(--sb) - 12px);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.7,.2,1);box-shadow:var(--sh-lg)}
.sheet.show{transform:none}
.sheet .handle{padding:8px 0 4px;display:grid;place-items:center;flex:none}
.sheet .handle i{width:36px;height:4px;border-radius:2px;background:var(--border)}
.sheet .shead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:4px 8px 4px 16px;flex:none}
.sheet .shead h3{margin:0;padding-top:8px;font-size:16px;line-height:24px;font-weight:600}
.sheet .smeta{padding:0 16px 4px;display:grid;gap:4px;color:var(--text-3);flex:none}
.sheet .sbody{overflow-y:auto;padding:12px 16px 16px;display:grid;gap:16px;align-content:start;flex:1 1 auto;min-height:0}
.sheet .sfoot{flex:none;display:flex;align-items:center;gap:16px;padding:12px 16px;border-top:1px solid var(--border-2)}
.sheet .sfoot .btn{flex:1}
.sheet .safe{height:var(--hi);flex:none}
.sheet.confirm .sbody{gap:12px}
.sheet.confirm .cfoot{display:grid;gap:12px;padding:8px 16px 16px}

.opt{display:flex;align-items:center;gap:12px;min-height:44px;width:100%;border:0;background:none;padding:0;text-align:left;font-size:16px;line-height:24px;color:var(--text-2);font-weight:500}

.cb{width:20px;height:20px;flex:none;border-radius:6px;border:1px solid var(--border);background:#fff;display:grid;place-items:center;color:#fff}
.cb.radio{border-radius:999px}
.cb.on{background:var(--brand);border-color:var(--brand)}
.cb.radio.on{background:#fff;border:6px solid var(--brand)}
.dot{width:8px;height:8px;border-radius:999px;display:inline-block}
.slabel{font-size:14px;line-height:20px;font-weight:600;color:var(--text-2)}

/* access */
.auth{min-height:100%;display:flex;flex-direction:column;padding:56px 16px 24px;gap:40px}
.auth .brand{display:grid;justify-items:center}
.auth .form{display:grid;gap:20px}
.auth .head{display:grid;gap:4px}
.auth .head h2{margin:0;font-size:20px;line-height:30px;font-weight:600}
.auth .head p{margin:0;color:var(--text-3)}
.auth .center{justify-items:center;text-align:center}
.req{display:grid;gap:6px;margin-top:2px}
.req div{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--text-3)}
.req .ok{color:var(--success)} .req .no{color:var(--ph)}
.code{display:flex;gap:8px;justify-content:center}

/* ================= indicadores de rolagem ================= */
function initScrollHints(root){
  $$('.hscroll',root).forEach(h=>{
    if(h.nextElementSibling&&h.nextElementSibling.classList.contains('dots')) return;
    const n=h.children.length; const d=document.createElement('div'); d.className='dots'; d.setAttribute('aria-hidden','true');
    d.innerHTML=Array.from({length:n},(_,i)=>`<i class="${i?'':'on'}"></i>`).join(''); h.after(d);
    const upd=()=>{const w=h.children[0].offsetWidth+12; let i=Math.round(h.scrollLeft/w); if(h.scrollLeft+h.clientWidth>=h.scrollWidth-2) i=n-1; [...d.children].forEach((x,j)=>x.classList.toggle('on',j===i));};
    h.addEventListener('scroll',upd,{passive:true});
  });
  $$('#u-pills,#b-pills,.tabs,#m-pre,#d-pre',root).forEach(p=>{
    p.classList.add('fade');
    const upd=()=>p.classList.toggle('at-end',p.scrollLeft+p.clientWidth>=p.scrollWidth-2);
    if(!p.dataset.hint){p.dataset.hint='1';p.addEventListener('scroll',upd,{passive:true});}
    requestAnimationFrame(upd);
  });
}

/* ================= unidades: filtros ================= */
function fMeses(m){return m.preset!=null||m.min!=null||m.max!=null;}
function fValor(v){return v.min!=null||v.max!=null;}
function matchUnit(u,F,q){
  if(q){const t=(u.condo+' '+u.bloco+' '+u.un+' '+u.ind+' '+u.id).toLowerCase(); if(!t.includes(q.toLowerCase())) return false;}
  const m=F.meses;
  if(m.preset!=null && u.meses<m.preset) return false;
  if(m.min!=null && u.meses<m.min) return false;
  if(m.max!=null && u.meses>m.max) return false;
  const v=F.valor;
  if(fValor(v)){ if(u.valor==null) return false; if(v.min!=null&&u.valor<v.min) return false; if(v.max!=null&&u.valor>v.max) return false; }
  if(F.situacao.length&&!F.situacao.some(v=>(v==='com'&&u.procs.length>0)||(v==='sem'&&!u.procs.length)||(v==='outro'&&u.outro))) return false;
  if(F.advs.length&&!F.advs.includes(u.adv)) return false;
  return true;
}
function unitsFiltered(F=S.F,q=S.q){
  const r=UNITS.filter(u=>matchUnit(u,F,q));
  if(F.ordem!=='padrao') r.sort((a,b)=>a.condo.localeCompare(b.condo,'pt-BR')*(F.ordem==='za'?-1:1));
  return r;
}
function anyUnitFilter(F=S.F){return F.ordem!=='padrao'||fMeses(F.meses)||fValor(F.valor)||F.situacao.length>0||F.advs.length>0;}
function pillDefs(){
  const F=S.F,m=F.meses,v=F.valor;
  let ml='Meses de inadimplência';
  if(m.preset!=null) ml=m.preset===1?'1+ mês':m.preset+'+ meses';
  else if(m.min!=null&&m.max!=null) ml=`${m.min} a ${m.max} meses`;
  else if(m.min!=null) ml=`A partir de ${plural(m.min,'mês','meses')}`;
  else if(m.max!=null) ml=`Até ${plural(m.max,'mês','meses')}`;
  let vl='Valor da ação';
  if(v.min!=null&&v.max!=null) vl=`${brl(v.min)} – ${brl(v.max)}`; else if(v.min!=null) vl='A partir de '+brl(v.min); else if(v.max!=null) vl='Até '+brl(v.max);
  const SL={sem:'Sem processo',com:'Com processo',outro:'Não pertence ao escritório'}; const sl=F.situacao.length?SL[F.situacao[0]]+(F.situacao.length>1?' +'+(F.situacao.length-1):''):'Processo';
  const al=F.advs.length?F.advs[0]+(F.advs.length>1?' +'+(F.advs.length-1):''):'Advogado';
  const list=[
    {id:'situacao',label:sl,on:F.situacao.length>0},
    {id:'advogado',label:al,on:F.advs.length>0},
    {id:'valor',label:vl,on:fValor(v)},
    {id:'meses',label:ml,on:fMeses(m)},
    {id:'ordenar',label:F.ordem==='za'?'Condomínio (Z–A)':F.ordem==='az'?'Condomínio (A–Z)':'Ordenar',on:F.ordem!=='padrao'}
  ];
  const order=['ordenar','meses','valor','situacao','advogado'];
  const on=list.filter(p=>p.on).sort((a,b)=>['situacao','advogado','valor','meses','ordenar'].indexOf(a.id)-['situacao','advogado','valor','meses','ordenar'].indexOf(b.id));
  const off=list.filter(p=>!p.on).sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));
  return on.concat(off);
}
function pillsHTML(defs,act){return defs.map(p=>`<button type="button" class="pill ${p.on?'on':''}" data-act="${act}" data-f="${p.id}">${p.label}${ic('cd',16,2)}</button>`).join('');}
function unitCard(u){
  const proc=u.procs.length>1?plural(u.procs.length,'processo','processos'):u.procs.length?u.procs[0]:'Sem processo';
  return `<button type="button" class="card" data-act="open-unit" data-id="${u.id}">

function newPasswordScreen({title,sub,cta,next,backLink}){
  return {
    html:()=>`<div class="auth"><div class="brand">${LOGO('logo logo-lg')}</div><div class="form"><div class="head"><h2>${title}</h2><p>${sub}</p></div>
      <div class="field"><label for="np1">Nova senha</label><div class="inp" id="np1w"><input id="np1" type="password" autocomplete="new-password" placeholder="••••••••"><button type="button" class="eye" data-act="eye" aria-label="Mostrar senha">${ic('eyeoff',16)}</button></div><div id="np-req"></div></div>
      <div class="field"><label for="np2">Confirmar nova senha</label><div class="inp" id="np2w"><input id="np2" type="password" autocomplete="new-password" placeholder="••••••••"><button type="button" class="eye" data-act="eye" aria-label="Mostrar senha">${ic('eyeoff',16)}</button></div><span class="hint err" id="np-err" hidden>As senhas não coincidem</span></div>
      <button type="button" class="btn primary lg full" id="np-save" disabled>${cta}</button>
      ${backLink?`<button type="button" class="link gray" data-act="to-login">Voltar para o login</button>`:''}</div></div>`,
    mount(el){
      const a=$('#np1',el),b=$('#np2',el),save=$('#np-save',el);
      const sync=()=>{const r=reqList(a.value);$('#np-req',el).innerHTML=a.value?r.html:'';const mis=b.value&&b.value!==a.value;$('#np-err',el).hidden=!mis;$('#np2w',el).classList.toggle('err',!!mis);save.disabled=!(r.ok&&b.value===a.value);};
      a.addEventListener('input',sync);b.addEventListener('input',sync);
      save.addEventListener('click',next);
    }
  };
}
function codeScreen({title,sub,icon,after,backAct,expire}){
  return {
    html:()=>`<div class="auth"><div class="brand">${LOGO('logo logo-lg')}</div><div class="form"><div class="head center" style="justify-items:center"><span class="fi brand" style="width:48px;height:48px;margin-bottom:12px">${ic(icon,24)}</span><h2>${title}</h2><p>${sub}</p></div>
      <div class="code" id="code">${Array.from({length:6},(_,i)=>`<input inputmode="numeric" maxlength="1" placeholder="0" aria-label="Dígito ${i+1}">`).join('')}</div>
      ${expire?`<p class="hint" style="text-align:center;margin:0">${expire}</p>`:''}
      <button type="button" class="btn primary lg full" id="code-ok" disabled>Verificar código</button>
      <div class="links"><button type="button" class="link gray" data-act="${backAct}">${backAct==='back'?'Voltar':'Voltar para o login'}</button><button type="button" class="link gray" disabled>Reenviar código</button></div></div></div>`,
    mount(el){
      const ins=$$('#code input',el),ok=$('#code-ok',el);
      const sync=()=>{ok.disabled=!ins.every(i=>/\d/.test(i.value));};
      ins.forEach((inp,i)=>{
        inp.addEventListener('input',()=>{inp.value=inp.value.replace(/\D/g,'').slice(-1);if(inp.value&&ins[i+1])ins[i+1].focus();sync();});
        inp.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!inp.value&&ins[i-1]){ins[i-1].focus();}});
        inp.addEventListener('paste',e=>{const t=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,6);if(!t)return;e.preventDefault();t.split('').forEach((c,j)=>{if(ins[j])ins[j].value=c;});sync();});
      });
      ok.addEventListener('click',after);
    }
  };
}

    const pessoa=(n,doc,tel,w,c,e,e2)=>[[['Nome completo',n]],[['CPF/CNPJ',doc],['Telefone',tel]],[['WhatsApp',w],['Celular',c]],[['E-mail',e]],[['E-mail secundário',e2]]];
    const SEC=[
      ['unidade','Unidade','Somente leitura.',[[['Bloco',u.bloco],['Unidade',u.un]]],LJ],
      ['condominio','Condomínio','Somente leitura. Vale para todas as unidades do condomínio.',[[['CNPJ','11.222.333/0001-44']],[['Razão social','Condomínio '+u.condo.replace(/^(Condomínio|Edifício) /,'')]],[['Nome fantasia',u.condo]],[['Inscrição municipal','—'],['Inscrição estadual','—']],[['CEP','00000-000'],['Número','100']],[['Logradouro','Rua Exemplo']],[['Complemento','—'],['Bairro','Vila Olímpia']],[['Apelido',u.condo.replace(/^(Residencial|Condomínio|Edifício) /,'')]],[['Síndico','Marcos Vinícius Tavares']],[['Responsável','Marcos Vinícius Tavares'],['Cargo do responsável','Síndico']]],LJ],
      ['cobranca','Cobrança','Somente leitura.',[[['Indicador de cobrança','Inquilino']],'Endereço de correspondência',[['CEP','00000-000'],['Número','450']],[['Logradouro','Rua das Acácias']],[['Complemento','Bl. '+u.bloco+' · Ap. '+u.un],['Bairro','Vila Olímpia']],[['Cidade',u.cidade.split(', ')[0]],['Estado',u.cidade.split(', ')[1]]]],LJ],
      ['proprietario','Proprietário','Somente leitura no celular.',pessoa('Carlos Eduardo Mendes','423.891.234-56','(11) 98376-9876','—','—','—','—'),PC],
      ['inquilino','Inquilino','Somente leitura no celular.',pessoa(u.id===2740?'Fernanda Ribeiro Souza':u.ind,'512.673.489-20','(11) 98765-4321','—','—','fernanda.souza@outlook.com','—'),PC],
      ['imobiliaria','Imobiliária','Somente leitura no celular.',pessoa('Imobiliária Exemplo Ltda.','22.333.444/0001-55','(11) 3000-0000','—','—','contato@imobiliariaexemplo.com.br','—'),PC]
    ];
    const SIC={unidade:'home',condominio:'building',cobranca:'receipt',proprietario:'user',inquilino:'key',imobiliaria:'briefcase'};
    const rows=r=>r.map(x=>typeof x==='string'?`<span class="slabel" style="margin-top:4px">${x}</span>`:x.map(p=>fld(p[0],p[1])).join('')).join('');
    const ro=t=>`<div class="note">${ic('lock',16)}<span>${t}</span></div>`;
    return `<div class="tabbody">${ro('Dados somente para consulta. Para alterar, acesse o Portal pelo computador.')}${SEC.map(([id,t,sub,r,av])=>`<div class="acc ${S.acc[id]?'open':''}"><button type="button" data-act="acc" data-id="${id}" aria-expanded="${!!S.acc[id]}"><span style="display:flex;align-items:center;gap:12px"><span class="fi sm brand">${ic(SIC[id],16)}</span><span class="at">${t}</span></span><span class="chev">${ic('cd')}</span></button>${S.acc[id]?`<div class="ab"><div class="hr"></div>${rows(r)}</div>`:''}</div>`).join('')}</div>`;}
};
function updateHist(el){
  const q=S.hq.toLowerCase(); const list=HIST.filter(h=>!q||(h.who+' '+h.when+' '+h.desc).toLowerCase().includes(q));
  $('#h-list',el).innerHTML=list.length?list.map(h=>`<button type="button" class="rec" data-act="hist" data-k="${h.k}"><span class="rb"><span class="rn">${h.who}</span><span class="rd">${h.when}</span><span class="rt">${h.desc}</span></span>${ic('cr')}</button>`).join(''):`<div class="empty"><div class="ring">${ic('search',24)}</div><div><h3>Nenhum registro encontrado</h3><p>Tente buscar por outro termo.</p></div></div>`;
}
const TABMOUNT={
  resumo:el=>initScrollHints(el),
  documentos:el=>{updateDocs(el);$('#d-q',el).addEventListener('input',e=>{S.dq=e.target.value;updateDocs(el);});},
  historico:el=>{updateHist(el);$('#h-q',el).addEventListener('input',e=>{S.hq=e.target.value;updateHist(el);});},
  boletos:el=>{updateBoletos();$('#b-q',el).addEventListener('input',e=>{S.bq=e.target.value;updateBoletos();});}
};
function setTab(id){
  const el=$('.screen',host); const keep=el.scrollTop; const pin=$('.ident',el).offsetHeight+48; S.tab=id;
  const body=$('#tabbody',el); body.innerHTML=TABS[id](); TABMOUNT[id]&&TABMOUNT[id](el);
  $$('.tab',el).forEach(t=>{const on=t.dataset.tab===id;t.classList.toggle('on',on);t.setAttribute('aria-selected',on);if(on)t.scrollIntoView({inline:'nearest',block:'nearest'});});
  el.scrollTop=keep>pin-48?pin-48:keep;
}

/* ================= cliques ================= */
document.addEventListener('click',e=>{
  const j=e.target.closest('[data-jump]'); if(j){jump(j.dataset.jump);return;}
  const a=e.target.closest('[data-act]'); if(!a) return;
  const act=a.dataset.act;
  switch(act){
    case 'menu': openMenu(); break;
    case 'menu-close': closeMenu(); break;
    case 'menu-go': { const to=a.dataset.to; if(current().name===to){closeMenu();break;} reset(to); break; }
    case 'logout': confirmLogout(); break;
    case 'do-logout': closeSheet(true); S.login.erro=null; S.ack=false; reset('login'); toast('Você saiu do Portal Jurídico.'); break;
    case 'sheet-close': closeSheet(); break;
    case 'back': back(); break;
    case 'forgot': go('esqueci'); break;
    case 'to-login': S.login.erro=null; reset('login'); break;
    case 'to-code': go('digitarCodigo'); break;
    case 'eye': { const inp=a.parentElement.querySelector('input'); const show=inp.type==='password'; inp.type=show?'text':'password'; a.innerHTML=ic(show?'eye':'eyeoff',16); a.setAttribute('aria-label',show?'Ocultar senha':'Mostrar senha'); break; }
    case 'scenarios': openSheet({title:'Cenários de teste',body:`<ul class="pbox" style="border:0;padding:0;margin:0;list-style:none;display:grid;gap:10px">${scenarioItems()}</ul>`}); break;
    case 'ufilter': openUnitFilter(a.dataset.f); break;
    case 'ord': S.F.ordem=S.F.ordem===a.dataset.v?'padrao':a.dataset.v; closeSheet(); updateUnidades(); break;
    case 'u-clear': S.F={ordem:'padrao',meses:{preset:null,min:null,max:null},valor:{min:null,max:null},situacao:[],advs:[]}; S.q=''; S.shown=4; S.autoLoads=0; { const q=$('#u-q'); if(q) q.value=''; } updateUnidades(); break;
    case 'u-more': S.shown+=4; S.autoLoads=0; updateUnidades(); break;
    case 'open-unit': S.unit=UNITS.find(u=>u.id===+a.dataset.id); S.tab='resumo'; S.hq=''; S.bq=''; S.dq=''; S.BF={status:[],tipos:[],procs:[],dias:{preset:null,min:null,max:null}}; go('detalhe'); break;
    case 'tab': setTab(a.dataset.tab); break;
    case 'bexp': { if(a.closest('.sheet')) break; S.bexp[a.dataset.k]=!S.bexp[a.dataset.k]; updateBoletos(); break; }
    case 'proc-bol': openProcBoletos(+a.dataset.i); break;
    case 'ack-ok': closeAck(); break;
    case 'hist': openHist(a.dataset.k); break;
    case 'bfilter': if(a.dataset.f==='processo') openProcFilter(); else if(a.dataset.f==='dias') openDiasFilter(); else openBolFilter(a.dataset.f); break;
    case 'b-clear': S.BF={status:[],tipos:[],procs:[],dias:{preset:null,min:null,max:null}}; S.bq=''; { const q=$('#b-q'); if(q) q.value=''; } updateBoletos(); break;
    case 'acc': S.acc[a.dataset.id]=!S.acc[a.dataset.id]; { const el=$('.screen',host); const k=el.scrollTop; $('#tabbody',el).innerHTML=TABS.dados(); el.scrollTop=k; } break;
    case 'pacc': S.pacc[a.dataset.id]=!S.pacc[a.dataset.id]; refresh(); break;
    case 'faq': { const i=+a.dataset.i; S.faq=S.faq===i?-1:i; refresh(); break; }
    case 'canal': toast('No protótipo o contato não é aberto.'); break;
    case 'refresh': {
      if(a.classList.contains('busy')) break;
      const t=a.dataset.t, list=$(t==='hist'?'#h-list':'#b-list');
      a.classList.add('busy'); a.setAttribute('aria-busy','true'); if(list) list.classList.add('busy-list');
      setTimeout(()=>{ a.classList.remove('busy'); a.removeAttribute('aria-busy'); if(list) list.classList.remove('busy-list');
        const el=$('.screen',host); if(t==='hist') updateHist(el); else updateBoletos();
        const d=new Date(), hh=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
        toast((t==='hist'?'Histórico atualizado':'Boletos atualizados')+' às '+hh+'.'); },900);
      break; }
    case 'dl': toast('No protótipo o download não está disponível.'); break;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(sheetEl)closeSheet();else if(menu.classList.contains('open'))closeMenu();}});

/* ================= painel / atalhos ================= */
function scenarioItems(){return [
  ['nome@escritorio.com.br','Senha Teste@123 entra direto em Unidades.'],
  ['primeiro@escritorio.com.br','Primeiro acesso: pede para criar a senha.'],
  ['2fa@escritorio.com.br','Pede o código de autenticação em duas etapas.'],
  ['bloqueado@escritorio.com.br','Mostra o aviso de conta bloqueada.'],
  ['inativo@escritorio.com.br','Mostra o aviso de acesso indisponível.'],
  ['Senha diferente de Teste@123','Mostra o erro de e-mail ou senha incorretos.']
].map(([c,t])=>`<li><code>${c}</code><span>${t}</span></li>`).join('');}
$('#scenarios').innerHTML=scenarioItems();
function jump(to){
  closeSheet(true);
  if(to==='login'){S.login.erro=null;reset('login');return;}
  if(to==='unidades'){reset('unidades');return;}
  if(to==='perfil'){reset('perfil');return;}
  if(to==='suporte'){reset('suporte');return;}
  S.unit=UNITS[0];S.tab=to==='historico'?'historico':'resumo';S.stack=[{name:'unidades',params:{},scroll:0}];go('detalhe',{},'fade');
}

/* ================= escala do aparelho no computador ================= */
function fit(){
  const w=$('#dwrap'); if(window.innerWidth<=520){w.style.transform='';w.style.height='';return;}
  const s=Math.min(1,(window.innerHeight-48)/836); w.style.transform=`scale(${s})`; w.style.height=(812*s)+'px'; w.style.marginBottom='0';
}
window.addEventListener('resize',fit); fit();

/* digitar código: mostrar e-mail */
const _m=SCREENS.digitarCodigo.mount; SCREENS.digitarCodigo.mount=function(el,p){_m(el,p);const ce=$('#ce',el);if(ce)ce.textContent=S.recEmail;};

reset('login');
})();
